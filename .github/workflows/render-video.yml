name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composición a renderizar"
        type: choice
        default: LLMFYAd
        options:
          - LLMFYAd
          - LLMFYExplainer

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSITION: ${{ inputs.composition || 'LLMFYAd' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure browser is installed
        run: npx remotion browser ensure

      - name: Render video
        run: |
          if [ "$COMPOSITION" = "LLMFYExplainer" ]; then
            OUT=out/llmfy-explainer.mp4
            npx remotion render src/index.tsx "$COMPOSITION" "$OUT" --codec h264 --crf 16 --jpeg-quality 95 --x264-preset slow
          else
            OUT=out/llmfy-ad.mp4
            npx remotion render src/index.tsx "$COMPOSITION" "$OUT" --codec h264
          fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION == 'LLMFYExplainer' && 'rendered-explainer' || 'rendered-video' }}
          path: ${{ env.OUT }}
          retention-days: 30
